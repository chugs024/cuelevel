name: iPhone, iPad and Mac TestFlight
# Builds CueLevel for iPhone and iPad and/or for the Mac App Store (Mac Catalyst), signs it (Xcode creates the
# certificates and profiles through the API key), and uploads it to App Store Connect for TestFlight.
# Needs the repository secret ASC_KEY_P8 (the .p8 file of the App Store Connect API key below, Admin access),
# and the app record in App Store Connect for the bundle ID com.cuelevel.app (with the macOS platform added for Mac).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (for example 1.0.0)"
        required: true
        default: "1.0.0"
      platforms:
        description: "Which builds to upload"
        required: true
        default: "both"
        type: choice
        options: [both, iphone-ipad, mac]
      revoke_build_certificates:
        description: "Revoke the throwaway 'Created via API' development certificates these builds leave behind (only with the account owner's OK)"
        required: true
        default: false
        type: boolean
env:
  # Not secret: they identify the key. Only the .p8 file (ASC_KEY_P8) is a secret.
  KEY_ID: BYLJRNNN9R
  ISSUER: 143e20b1-9ebc-48d7-ac2c-7b52fe48ed2b
jobs:
  upload:
    strategy:
      fail-fast: false
      max-parallel: 1   # one at a time: each build tidies up the signing certificate it made
      matrix:
        include:
          - platform: iphone-ipad
            destination: "generic/platform=iOS"
            altool: ios
            package: ipa
          - platform: mac
            destination: "generic/platform=macOS,variant=Mac Catalyst"
            altool: macos
            package: pkg
    name: Upload (${{ matrix.platform }})
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Skip unless asked
        id: wanted
        run: echo "go=${{ inputs.platforms == 'both' || inputs.platforms == matrix.platform }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.wanted.outputs.go == 'true'
      - name: Check secrets
        if: steps.wanted.outputs.go == 'true'
        env:
          HAS_KEY: ${{ secrets.ASC_KEY_P8 != '' }}
        run: |
          [[ "$HAS_KEY" == true ]] || { echo "::error::Add the ASC_KEY_P8 secret (see Docs/iPhone app.md)"; exit 1; }
      - name: API key file
        if: steps.wanted.outputs.go == 'true'
        env:
          KEY: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          # Normalise pasted text: Windows line endings and stray spaces around the lines.
          printf '%s\n' "$KEY" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          head -1 "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" | grep -q "BEGIN PRIVATE KEY" || { echo "::error::ASC_KEY_P8 doesn't start with -----BEGIN PRIVATE KEY-----"; exit 1; }
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"
      - name: Use Xcode 26 or later
        if: steps.wanted.outputs.go == 'true'
        run: |
          # App Store Connect only accepts apps built with the iOS 26 / macOS 26 SDK or later.
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [[ -n "$X" ]] || { echo "::error::No Xcode 26 on this runner"; ls -d /Applications/Xcode*; exit 1; }
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: XcodeGen
        if: steps.wanted.outputs.go == 'true'
        run: brew install xcodegen && cd Mobile && xcodegen generate
      - name: Archive
        if: steps.wanted.outputs.go == 'true'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -o pipefail
          BUILD=$((100 + GITHUB_RUN_NUMBER))
          xcodebuild -project Mobile/CueLevelMobile.xcodeproj -scheme CueLevel -configuration Release -destination '${{ matrix.destination }}' \
            -archivePath build/CueLevel.xcarchive -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" archive 2>&1 | tee archive.log | grep -E "error:|ARCHIVE|Signing" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log || { grep -E "error:" archive.log | head -15 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Export the app
        if: steps.wanted.outputs.go == 'true'
        run: |
          set -o pipefail
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>327ABFB3W2</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/CueLevel.xcarchive -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" 2>&1 | tee export.log | grep -E "error:|EXPORT" || true
          grep -q "EXPORT SUCCEEDED" export.log || { grep -E "error:|Error" export.log | head -15 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          ls -la build/export
      - name: Keep the app for a manual upload (Transporter)
        if: steps.wanted.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CueLevel-${{ matrix.platform }}
          path: build/export/*.${{ matrix.package }}
          retention-days: 3
      - name: Upload to App Store Connect
        if: steps.wanted.outputs.go == 'true'
        run: |
          # altool finds the key by ID in ~/private_keys.
          mkdir -p ~/private_keys && cp "$KEY_PATH" ~/private_keys/
          FILE=$(ls build/export/*.${{ matrix.package }} | head -1)
          xcrun altool --upload-app -f "$FILE" -t ${{ matrix.altool }} --apiKey "$KEY_ID" --apiIssuer "$ISSUER" 2>&1 | tee upload.log
          if grep -qiE "error|failed" upload.log && ! grep -qi "UPLOAD SUCCEEDED\|No errors uploading" upload.log; then
            grep -iE "error|failed" upload.log | head -15 | while IFS= read -r l; do echo "::error::$l"; done; exit 1
          fi
          echo "::notice::Uploaded CueLevel ${{ inputs.version }} for ${{ matrix.platform }} (build $((100 + GITHUB_RUN_NUMBER))). It appears in TestFlight after Apple's processing, usually 10–30 minutes."
      - name: Revoke this build machine's development certificate
        # Xcode makes a development certificate on every fresh build machine; its private key is thrown away with the
        # machine, so the certificate can never be used again. Apple allows only a few, so they're revoked here.
        # Only certificates named "Created via API" (made by these builds) are touched; your own are left alone.
        if: always() && steps.wanted.outputs.go == 'true' && inputs.revoke_build_certificates
        run: |
          [[ -f "$KEY_PATH" ]] || exit 0
          pip3 install --quiet --break-system-packages pyjwt cryptography >/dev/null 2>&1 || pip3 install --quiet pyjwt cryptography >/dev/null
          python3 - <<'PY'
          import jwt, time, json, os, urllib.request
          key = open(os.environ["KEY_PATH"]).read()
          token = jwt.encode({"iss": os.environ["ISSUER"], "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
                             key, algorithm="ES256", headers={"kid": os.environ["KEY_ID"], "typ": "JWT"})
          def call(method, url):
              req = urllib.request.Request(url, method=method, headers={"Authorization": f"Bearer {token}"})
              with urllib.request.urlopen(req) as r: return json.loads(r.read() or b"{}")
          base = "https://api.appstoreconnect.apple.com/v1/certificates"
          found = call("GET", base + "?filter[certificateType]=DEVELOPMENT,MAC_APP_DEVELOPMENT,IOS_DEVELOPMENT&limit=200")["data"]
          for c in found:
              a = c["attributes"]
              if a.get("name") == "Created via API":
                  call("DELETE", f"{base}/{c['id']}")
                  print("Revoked build-machine certificate", c["id"], a.get("certificateType"))
          PY
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys" ~/private_keys
