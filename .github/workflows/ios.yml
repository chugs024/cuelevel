name: iPhone and iPad app
on:
  push:
    branches: [main, dev]
    paths: ["Mobile/**", "Source/Model.swift", "Source/ClipGain.swift", "Source/CueEdit.swift", "Source/ReferenceLibrary.swift", "Source/Plan.swift", "Reference Library/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: brew install xcodegen && cd Mobile && xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project Mobile/CueLevelMobile.xcodeproj -scheme CueLevel -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*Mobile/|BUILD" || true
          if ! grep -q "BUILD SUCCEEDED" build.log; then grep -E "error:" build.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; fi
      - name: FFmpeg engine (cached, for example cues)
        id: engine
        uses: actions/cache/restore@v4
        with:
          path: Engine
          key: ffmpeg-7.1-lgpl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Scripts/build-ffmpeg-lgpl.sh') }}
      - name: Build LGPL FFmpeg
        if: steps.engine.outputs.cache-hit != 'true'
        run: Scripts/build-ffmpeg-lgpl.sh Engine
      - name: Run the app on the simulator and take screenshots
        run: |
          set -x
          DEMO="$RUNNER_TEMP/Example show"; SHOTS="$PWD/build/screens"; mkdir -p "$SHOTS"
          Mobile/Scripts/make-demo-cues.sh "$PWD/Engine/ffmpeg" "$DEMO"
          APP=$(find build/ios -name "CueLevel.app" -path "*iphonesimulator*" | head -1)
          shoot() { # device name, prefix
            UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name']=='$1'))")
            xcrun simctl boot "$UDID" || true; xcrun simctl bootstatus "$UDID" -b
            xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 || true
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl launch "$UDID" com.cuelevel.app; sleep 6; xcrun simctl io "$UDID" screenshot "$SHOTS/$2-1-empty.png"
            xcrun simctl terminate "$UDID" com.cuelevel.app || true
            xcrun simctl launch "$UDID" com.cuelevel.app -importFolder "$DEMO"; sleep 40; xcrun simctl io "$UDID" screenshot "$SHOTS/$2-2-measured.png"
            xcrun simctl terminate "$UDID" com.cuelevel.app || true
            xcrun simctl launch "$UDID" com.cuelevel.app -select 2; sleep 6; xcrun simctl io "$UDID" screenshot "$SHOTS/$2-3-plan.png"
            xcrun simctl terminate "$UDID" com.cuelevel.app || true
            xcrun simctl launch "$UDID" com.cuelevel.app -levelAll; sleep 60; xcrun simctl io "$UDID" screenshot "$SHOTS/$2-4-levelled.png"
            xcrun simctl terminate "$UDID" com.cuelevel.app || true
            for n in 2 3 4; do xcrun simctl launch "$UDID" com.cuelevel.app -select $n; sleep 6; xcrun simctl io "$UDID" screenshot "$SHOTS/$2-5-result-$n.png"; xcrun simctl terminate "$UDID" com.cuelevel.app || true; done
            # Pro: the editor (unlocked for the simulator with -pro), and the Pro sheet when it isn't.
            xcrun simctl launch "$UDID" com.cuelevel.app -select 2 -edit -pro; sleep 9; xcrun simctl io "$UDID" screenshot "$SHOTS/$2-6-editor.png"
            xcrun simctl terminate "$UDID" com.cuelevel.app || true
            xcrun simctl launch "$UDID" com.cuelevel.app -select 2 -edit; sleep 9; xcrun simctl io "$UDID" screenshot "$SHOTS/$2-7-pro.png"
            xcrun simctl terminate "$UDID" com.cuelevel.app || true
            DATA=$(xcrun simctl get_app_container "$UDID" com.cuelevel.app data)
            ls -la "$DATA/Documents/Levelled" | tee "$SHOTS/$2-levelled-files.txt"
            for f in "$DATA/Documents/Levelled"/*; do "$PWD/Engine/ffmpeg" -hide_banner -nostats -i "$f" -map 0:a:0 -af loudnorm=I=-18:print_format=summary -f null - 2>&1 | grep -E "Input Integrated|Input True Peak" | sed "s|^|$(basename "$f"): |" | tee -a "$SHOTS/$2-levelled-files.txt"; done
            cp "$DATA/Library/Application Support/session.json" "$SHOTS/$2-session.json" || true
            xcrun simctl shutdown "$UDID" || true
          }
          shoot "iPhone 16 Pro" iphone
          shoot "iPad Pro 13-inch (M4)" ipad || echo "iPad simulator not available"
      - name: Prepare screenshot annotations
        if: always()
        run: |
          # GitHub keeps annotations to 4 KB each, 10 per step, 50 per job: small WebP images split into parts.
          mkdir -p build/ann; cd build/screens 2>/dev/null || exit 0
          for f in ${SHOTS_LIST:-iphone-5-result-2.png iphone-6-editor.png iphone-7-pro.png ipad-6-editor.png iphone-4-levelled.png}; do
            [[ -f "$f" ]] || continue
            sips -s format jpeg -s formatOptions 40 -Z 400 "$f" --out "../ann/${f%.png}.jpg" >/dev/null || continue
            base64 -i "../ann/${f%.png}.jpg" | tr -d '\n' | fold -w 3900 > "../ann/${f%.png}.b64"
          done
          python3 - <<'PY'
          import json, glob, os
          parts = []
          for b in sorted(glob.glob('../ann/*.b64')):
              chunks = open(b).read().split()
              name = os.path.basename(b)[:-4]
              parts += [f"::notice title=shot {name} {i+1}/{len(chunks)}::{c}" for i, c in enumerate(chunks)]
          for f in glob.glob('*-levelled-files.txt'):
              lines = [l.strip() for l in open(f) if 'Input' in l]
              parts.append(f"::notice title={f}::" + "%0A".join(lines)[:3900])
          for f in glob.glob('*-session.json'):
              try:
                  s = json.load(open(f))
                  lines = []
                  for c in s['cues']:
                      o = c.get('output') or {}
                      lines.append(f"{c['name']}: {c['state']}, gain {o.get('gainApplied')}, shortfall {o.get('shortfall')}, warnings {o.get('warnings')} {c.get('message','')}")
                  parts.append(f"::notice title={f}::" + "%0A".join(lines)[:3900])
              except Exception as e:
                  parts.append(f"::notice title={f}::could not read: {e}")
          for k in range(5):
              open(f'../ann/step{k}.txt', 'w').write("\n".join(parts[k * 9:(k + 1) * 9]))
          PY
      - name: Screenshots 1
        if: always()
        run: cat build/ann/step0.txt 2>/dev/null || true
      - name: Screenshots 2
        if: always()
        run: cat build/ann/step1.txt 2>/dev/null || true
      - name: Screenshots 3
        if: always()
        run: cat build/ann/step2.txt 2>/dev/null || true
      - name: Screenshots 4
        if: always()
        run: cat build/ann/step3.txt 2>/dev/null || true
      - name: Screenshots 5
        if: always()
        run: cat build/ann/step4.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-screens
          path: build/screens
          retention-days: 14
