name: Release
# Run from the Actions tab ("Release" → "Run workflow"), or let Claude trigger it.
# Builds, tests, signs with your Developer ID, notarises, then publishes the DMG and appcast.json to the
# public chugs024/cuelevel-updates repository. Installed copies of CueLevel pick the update up from there.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 1.0.1"
        required: true
      notes:
        description: "What's new (one line per change)"
        required: true
        default: "Improvements and fixes."
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
env:
  UPDATES_REPO: chugs024/cuelevel-updates
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check inputs and secrets
        env:
          VERSION: ${{ inputs.version }}
          HAS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
          HAS_UPDATES: ${{ secrets.UPDATES_TOKEN != '' }}
          HAS_NOTARY: ${{ secrets.NOTARY_PASSWORD != '' || secrets.NOTARY_KEY_P8 != '' }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must look like 1.0.1"; exit 1; }
          if git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null; then echo "::error::v$VERSION already exists"; exit 1; fi
          [[ "$HAS_CERT" == true ]] || { echo "::error::Secret MACOS_CERTIFICATE_P12 is missing (see Docs/Releasing.md)"; exit 1; }
          [[ "$HAS_NOTARY" == true ]] || { echo "::error::Notary secrets are missing (see Docs/Releasing.md)"; exit 1; }
          [[ "$HAS_UPDATES" == true ]] || { echo "::error::Secret UPDATES_TOKEN is missing (see Docs/Releasing.md)"; exit 1; }
          echo "BUILD=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: FFmpeg engine (cached)
        id: engine
        uses: actions/cache@v4
        with:
          path: Engine
          key: ffmpeg-7.1-lgpl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Scripts/build-ffmpeg-lgpl.sh') }}
      - name: Build LGPL FFmpeg
        if: steps.engine.outputs.cache-hit != 'true'
        run: Scripts/build-ffmpeg-lgpl.sh Engine
      - name: Tests
        run: FFMPEG=Engine/ffmpeg Scripts/run-tests.sh
      - name: Build CueLevel.app
        run: FFMPEG=Engine/ffmpeg Scripts/make-app.sh build
      - name: Import Developer ID certificate
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; KCPW="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          ID="$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          [[ -n "$ID" ]] || { echo "::error::No Developer ID Application identity in the certificate"; exit 1; }
          echo "SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
      - name: Sign, notarise, package
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM: 327ABFB3W2
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          if [[ -n "$NOTARY_KEY_P8" ]]; then
            echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"; export NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"
            unset NOTARY_APPLE_ID
          fi
          Scripts/sign-and-package.sh build "$VERSION"
      - name: Release notes and appcast
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          printf '%s\n' "$NOTES" > build/notes.md
          URL="https://github.com/$UPDATES_REPO/releases/download/v$VERSION/CueLevel-$VERSION.dmg"
          python3 Scripts/make-appcast.py "build/CueLevel-$VERSION.dmg" "$VERSION" "$BUILD" "$URL" build/notes.md build/appcast.json
      - name: Publish to cuelevel-updates
        env:
          GH_TOKEN: ${{ secrets.UPDATES_TOKEN }}
        run: |
          # LGPL: the exact FFmpeg source and build configuration ship next to every DMG.
          cp Engine/ffmpeg-7.1.tar.xz build/FFmpeg-7.1-source.tar.xz
          cp Engine/BUILD.txt build/FFmpeg-build-configuration.txt
          gh release create "v$VERSION" "build/CueLevel-$VERSION.dmg" build/FFmpeg-7.1-source.tar.xz build/FFmpeg-build-configuration.txt \
            --repo "$UPDATES_REPO" --title "CueLevel $VERSION" --notes-file build/notes.md
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/$UPDATES_REPO.git" "$RUNNER_TEMP/updates"
          cp build/appcast.json "$RUNNER_TEMP/updates/appcast.json"
          cd "$RUNNER_TEMP/updates"
          # Website: point the download buttons and version text at this release (the page also reads appcast.json live).
          if [[ -f docs/index.html ]]; then
            MB=$(( ($(stat -f%z "$GITHUB_WORKSPACE/build/CueLevel-$VERSION.dmg") + 524288) / 1048576 ))
            sed -i '' -E "s#releases/download/v[0-9.]+/CueLevel-[0-9.]+\.dmg#releases/download/v$VERSION/CueLevel-$VERSION.dmg#g; s#Version [0-9.]+#Version $VERSION#g; s#CueLevel [0-9]+\.[0-9]+\.[0-9]+\.#CueLevel $VERSION.#g; s#[0-9]+ MB#$MB MB#g" docs/index.html
            sed -i '' -E "s#releases/download/v[0-9.]+/#releases/download/v$VERSION/#g" docs/licenses.html 2>/dev/null || true
          fi
          git config user.name "CueLevel release"; git config user.email "releases@users.noreply.github.com"
          git add appcast.json docs; git commit -m "CueLevel $VERSION (build $BUILD)"; git push origin HEAD:main
      - name: Tag source
        run: |
          git config user.name "CueLevel release"; git config user.email "releases@users.noreply.github.com"
          git tag -a "v$VERSION" -m "CueLevel $VERSION (build $BUILD)"; git push origin "v$VERSION"
      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
